name: Vida

on:
  schedule:
    - cron: "27 * * * *"     # acorda toda hora, no minuto 27 (se mudar, mude também RITMO em app.js)
  workflow_dispatch:          # botão "Run workflow" para acordar na hora
  push:
    branches: [main]          # republica o site quando você muda algo

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: vida
  cancel-in-progress: false

jobs:
  acordar:
    # roda no horário, no botão "Run workflow", ou num envio cuja mensagem tenha [acordar]
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[acordar]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pensar e agir
        run: node brain/cerebro.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      - name: Guardar memória
        run: |
          git config user.name "quartinho"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data drawings
          git diff --cached --quiet || git commit -m "Uma acordada"
          git push

  empacotar:
    needs: acordar
    if: always() && (needs.acordar.result == 'success' || needs.acordar.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  publicar:
    needs: empacotar
    if: always() && needs.empacotar.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
